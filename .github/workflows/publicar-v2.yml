      - name: Publicar Release preliminar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## GoW_PSDV2 — Edición de prueba sin diagnósticos
          
          Versión **experimental** para God of War Collection en PS Vita. **No se ha probado esta compilación en una consola real; el soporte de las regiones EU y USA no está confirmado.**
          
          ### Cambios previstos
          - Resolución de ambos juegos a 960 × 544.
          - God of War I: FPS desbloqueados durante la partida, con menús a 30 FPS para evitar aceleración.
          - God of War II: 30 FPS originales.
          - Sin generación de archivos de diagnóstico ni registros.
          - Objetivo: soporte para EU PCSF00438 y USA PCSA00126 (pendiente de confirmar).
          
          ### Instalación
          1. Haz copia de seguridad de `ur0:tai/config.txt` y de cualquier plugin anterior.
          2. Copia `GoW_PSDV2.suprx` a `ur0:tai/`.
          3. Añádelo una sola vez en la sección del ID de tu región:
             - EU: `*PCSF00438` y debajo `ur0:tai/GoW_PSDV2.suprx`.
             - USA: `*PCSA00126` y debajo `ur0:tai/GoW_PSDV2.suprx`.
          4. No ejecutes simultáneamente otra versión del plugin. Desactiva los cambios de FPS y framebuffer de GoW en VitaGrafix.
          5. Reinicia la consola y comprueba primero los menús y la partida.
          
          Si falla, restaura tu configuración anterior. Los cambios de rendimiento y compatibilidad quedan pendientes de pruebas.
          
          **Archivo:** `GoW_PSDV2.suprx` | **SHA-256:** `2b9931a08ddb861bc3b0ac5bb430e533f5a16309403d7159f0fb2ad948aae90b`
          
          Proyecto: [Psdroid09](https://github.com/Psdroid09) · [YouTube PsDroid09](https://www.youtube.com/@PsDroid09)
          NOTES
          gh release create v2.0-beta-sin-logs GoW_PSDV2.suprx GoW_PSDV2_GoW2_30FPS_Sin_Logs.zip --title 'GoW_PSDV2 — GoW2 30 FPS (sin diagnósticos) [prueba]' --notes-file release-notes.md --target "$GITHUB_SHA" --prerelease
