name: Actualizar descripción del plugin sin diagnóstico

on:
  push:
    branches: [main]
    paths: [release/NOTAS_SIN_DIAGNOSTICO.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar descripción de la publicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit v1-sin-diagnostico
          --notes-file release/NOTAS_SIN_DIAGNOSTICO.md
